{% extends "base.html" %}

{% block title %}Validación de Entes Públicos{% endblock %}

{% block body_class %}inst-body{% endblock %}

{% block content %}

<div class="inst-container">

<h1>Reporte de Códigos de Ética</h1>
<h2>1. Verificación de Entes Públicos</h2>

<div id="tabs">
    <button type="button" data-poder="Ejecutivo" onclick="filtrar('Ejecutivo')">Poder Ejecutivo</button>
    <button type="button" data-poder="Legislativo" onclick="filtrar('Legislativo')">Poder Legislativo</button>
    <button type="button" data-poder="Judicial" onclick="filtrar('Judicial')">Poder Judicial</button>
    <button type="button" data-poder="Autonomo" onclick="filtrar('Autonomo')">Organismos Autónomos</button>
    <button type="button" data-poder="Municipio" onclick="filtrar('Municipio')">Municipios</button>
    <button type="button" data-poder="TODOS" onclick="filtrar('TODOS')">Mostrar todos</button>
    <button type="button" id="btn-orden" onclick="toggleOrden()" style="margin-left:8px;">
        A→Z
    </button>
    <input
        type="text"
        id="buscador"
        placeholder="Buscar institución"
        oninput="aplicarFiltros()"
        autocomplete="off"
    >
    <span id="buscador-contador"></span>
</div>

<br>

<form id="formulario-dinamico"></form>

<div id="paginacion" style="display:none; margin: 20px 0; align-items:center; gap:8px; flex-wrap:wrap;">
    <button type="button" id="btn-anterior" onclick="cambiarPagina(-1)">← Anterior</button>
    <span id="paginacion-info" style="font-size:14px; color:#555;"></span>
    <button type="button" id="btn-siguiente" onclick="cambiarPagina(1)">Siguiente →</button>
    <span style="margin-left:16px; font-size:13px; color:#888;">Mostrar
        <select id="por-pagina" onchange="cambiarPorPagina()" style="padding:3px 6px; font-size:13px;">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="9999">Todos</option>
        </select>
        por página
    </span>
</div>

<br>

<button type="button" onclick="window.location.href= window.BASE_URL + '/'">
    Volver al inicio
    <img src="{{ url_for('static', filename='assets/icons/arrow_back_24dp.svg')}}">
</button>

<button type="button" onclick="agregarEntrada()">
    Añadir nueva entrada
    <img src="{{ url_for('static', filename='assets/icons/add.svg')}}">
</button>

<button type="button" onclick="guardarValidacion()" class="btn-guardar">
    Guardar verificación
    <img src="{{ url_for('static', filename='assets/icons/save.svg')}}">
</button>

<button type="button" onclick="window.location.href=window.BASE_URL + '/descarga/instituciones'" class="btn-guardar">
    Descargar instituciones
</button>

<button type="button" onclick="irAValidarCodigos()" class="btn-validar">
    Verificar Códigos de Ética
    <img src="{{ url_for('static', filename='assets/icons/arrow_forward.svg')}}">
</button>

<script>

/* =======================
   ESTADO
======================= */
let filasOriginales = {};
let poderActivo = 'TODOS';
let hayCambiosPendientes = false;
let paginaActual = 1;
let porPagina = 10;
let ordenAlfabetico = false;

/* =======================
   NORMALIZACIÓN DE TEXTO
   Espeja la lógica del backend (`limpiar()` en app.py)
   para que la unique key (estado, nombre) coincida byte a byte.
======================= */
function normalizarNombre(txt) {
    if (txt == null) return '';
    return String(txt)
        .normalize('NFC')                                  // unifica é compuesto vs descompuesto
        .replace(/[\ufeff\u200b-\u200d\u2060\r]/g, '')     // invisibles
        .replace(/[\u00a0\u2009\u202f\t]/g, ' ')           // NBSP / thin spaces / tabs → espacio
        .replace(/"/g, '')                                 // comillas dobles
        .replace(/\s+/g, ' ')                              // colapsar espacios
        .trim();
}

/* =======================
   ORDEN ALFABÉTICO
======================= */
function toggleOrden() {
    ordenAlfabetico = !ordenAlfabetico;
    document.getElementById('btn-orden').textContent = ordenAlfabetico ? 'Z→A' : 'A→Z';
    paginaActual = 1;
    renderPagina();
}

/* =======================
   CARGA INICIAL (bootstrap)
======================= */
Loader.show("Cargando instituciones");
fetch(window.BASE_URL + '/bootstrap-instituciones')
    .then(r => r.json())
    .then(boot => {

        const data       = boot.instituciones.data;
        const verificados = boot.verificados || [];
        const estatus    = boot.estatus;

        const formulario = document.getElementById('formulario-dinamico');

        (data || []).forEach(fila => {
            const nombre = fila.nombre || '';
            const normalizada = {
                id:             fila.id,
                nombre:         nombre,
                nombreOriginal: nombre,   // 👈 guardamos el nombre tal como vino de BD
                poderGobierno:  fila.poderGobierno || fila.poder_gobierno || '',
                confirmado:     fila.confirmado || false,
                verificado:     fila.verificado || false,
            };
            filasOriginales[normalizada.id] = normalizada;
            crearFila(normalizada, formulario);
        });

        hayCambiosPendientes = false;
        filtrar('TODOS');

        // Aplicar estatus de códigos (badge)
        document.querySelectorAll('.form-group').forEach(div => {
            const normalizado = div.dataset.nombre
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/\s+/g, "_");
            const badge = div.querySelector('.badge');
            if (badge && estatus.includes(normalizado)) {
                badge.textContent = "Código Validado";
                badge.classList.remove("pendiente");
                badge.classList.add("validado");
            }
        });

        // Verificar cierre
        if (boot.cerrado) {
            document.querySelectorAll('.form-group input').forEach(i => i.disabled = true);
            document.querySelectorAll('.form-group button').forEach(b => b.disabled = true);
            document.querySelectorAll('button').forEach(b => {
                if (b.textContent.trim().startsWith('Volver')) return;
                if (b.textContent.trim().startsWith('Descargar')) return;
                b.disabled = true;
            });
            const aviso = document.createElement('div');
            aviso.className = 'aviso-cerrado';
            aviso.textContent = '⚠ Este proceso ya fue enviado y está cerrado. No es posible realizar modificaciones.';
            document.querySelector('.inst-container').prepend(aviso);
        }
    })
    .catch(err => console.error('Bootstrap error:', err))
    .finally(() => Loader.hide());

/* =======================
   CREAR FILA
======================= */
function crearFila(fila, formulario, esNueva = false) {

    const div = document.createElement('div');
    div.className = 'form-group';
    if (fila.verificado) div.classList.add('verificado');

    div.dataset.id         = fila.id;
    div.dataset.poder      = fila.poderGobierno;
    div.dataset.nombre     = fila.nombre;
    div.dataset.confirmado = String(fila.confirmado || false);
    div.dataset.verificado = String(fila.verificado || false);

    const nombreSeguro = fila.nombre.replace(/"/g, '&quot;');

    div.innerHTML = `
        <p>
            <strong>Estatus del Código de Ética:</strong>
            <span class="badge pendiente">Pendiente de verificación</span>
        </p>

        <p>¿Este ente público se encuentra obligado a
        <b>EMITIR</b> un Código de Ética según el Art. 16 de la LGRA?</p>

        <input type="text" value="${nombreSeguro}" ${!esNueva ? 'readonly' : ''}>
        <br>

        <button type="button" class="btn-editar">Editar</button>
        <button type="button" class="btn-verificar ${fila.verificado ? 'activo' : ''}">
            ${fila.verificado ? '✓ Verificado (obligado)' : 'Confirmar'}
        </button>
        <button type="button" class="btn-eliminar" style="background:#9B2247;color:white;">Eliminar</button>
    `;

    const input        = div.querySelector('input');
    const btnEditar    = div.querySelector('.btn-editar');
    const btnVerificar = div.querySelector('.btn-verificar');
    const btnEliminar  = div.querySelector('.btn-eliminar');

    // Editar nombre
    // IMPORTANTE: nunca tocamos `nombreOriginal` aquí — eso es lo que el
    // backend usa como llave para encontrar el registro existente en BD
    // y aplicarle un UPDATE en lugar de un INSERT (que generaría duplicado).
    input.oninput = () => {
        filasOriginales[fila.id].nombre = input.value;
        div.dataset.nombre = input.value;
        hayCambiosPendientes = true;
    };

    btnEditar.onclick = () => {
        input.readOnly = false;
        input.focus();
        hayCambiosPendientes = true;
    };

    // Verificar / desverificar (toggle)
    btnVerificar.onclick = () => {
        const estaVerificado = div.dataset.verificado === 'true';
        const nuevoEstado    = !estaVerificado;

        div.dataset.verificado = String(nuevoEstado);
        filasOriginales[fila.id].verificado = nuevoEstado;

        if (nuevoEstado) {
            div.classList.add('verificado');
            btnVerificar.classList.add('activo');
            btnVerificar.textContent = '✓ Verificado (obligado)';
        } else {
            div.classList.remove('verificado');
            btnVerificar.classList.remove('activo');
            btnVerificar.textContent = 'Confirmar';
        }

        hayCambiosPendientes = true;
    };

    // Eliminar — marca para borrado real en el backend
    // El registro se eliminará de la BD al guardar
    btnEliminar.onclick = () => {
        if (!confirm(`¿Eliminar "${input.value}" de la lista?\n\nEsta acción borrará el registro permanentemente al guardar.`)) return;
        filasOriginales[fila.id].eliminado   = true;
        filasOriginales[fila.id].verificado  = false;
        filasOriginales[fila.id].confirmado  = false;
        // `nombreOriginal` ya se guardó al cargar la fila desde el bootstrap,
        // así que el backend siempre tiene la clave correcta para el DELETE.
        div.dataset.verificado = 'false';
        div.dataset.confirmado = 'false';
        div.style.display = 'none';
        hayCambiosPendientes = true;
    };

    formulario.appendChild(div);
}


/* =======================
   FILTRADO
======================= */
function filtrar(poder) {
    poderActivo = poder;
    paginaActual = 1;

    const tabs = document.getElementById('tabs');
    tabs.querySelectorAll('button').forEach(btn => btn.classList.remove('activo'));
    const botonActivo = tabs.querySelector(`[data-poder="${poder}"]`);
    if (botonActivo) botonActivo.classList.add('activo');

    renderPagina();
}

/* =======================
   BÚSQUEDA
======================= */
function aplicarFiltros() {
    paginaActual = 1;
    renderPagina();
}

/* =======================
   PAGINACIÓN
======================= */
function renderPagina() {
    const query = ((document.getElementById('buscador') || {}).value || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

    const visibles = Array.from(document.querySelectorAll('.form-group'))
        .filter(div => {
            const eliminado = filasOriginales[div.dataset.id]?.eliminado;
            return !eliminado;
        });

    let coinciden = visibles.filter(div => {
        const coincidePoder    = poderActivo === 'TODOS' || div.dataset.poder === poderActivo;
        const nombreNorm       = (div.dataset.nombre || '').normalize('NFD')
                                .replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const coincideBusqueda = !query || nombreNorm.includes(query);
        return coincidePoder && coincideBusqueda;
    });

    if (ordenAlfabetico !== false) {
        coinciden = [...coinciden].sort((a, b) => {
            const na = (a.dataset.nombre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            const nb = (b.dataset.nombre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            return ordenAlfabetico ? na.localeCompare(nb) : nb.localeCompare(na);
        });
    }

    const total     = coinciden.length;
    const totalPags = porPagina >= 9999 ? 1 : Math.max(1, Math.ceil(total / porPagina));
    if (paginaActual > totalPags) paginaActual = totalPags;

    const inicio   = (paginaActual - 1) * porPagina;
    const fin      = porPagina >= 9999 ? total : inicio + porPagina;
    const enPagina = new Set(coinciden.slice(inicio, fin));

    document.querySelectorAll('.form-group').forEach(div => {
        const eliminado = filasOriginales[div.dataset.id]?.eliminado;
        if (eliminado) {
            div.style.display = 'none';
        } else {
            div.style.display = enPagina.has(div) ? 'block' : 'none';
        }
    });

    const paginacion = document.getElementById('paginacion');
    paginacion.style.display = 'flex';

    document.getElementById('btn-anterior').disabled  = paginaActual <= 1;
    document.getElementById('btn-siguiente').disabled = paginaActual >= totalPags;

    const desde = total === 0 ? 0 : inicio + 1;
    const hasta  = Math.min(fin, total);
    document.getElementById('paginacion-info').textContent =
        total === 0
            ? 'Sin resultados'
            : `${desde}–${hasta} de ${total} institución${total !== 1 ? 'es' : ''}`;

    const contador = document.getElementById('buscador-contador');
    if (contador) {
        if (query) {
            contador.textContent  = `${total} resultado${total !== 1 ? 's' : ''}`;
            contador.style.display = 'inline';
        } else {
            contador.style.display = 'none';
        }
    }
}

function cambiarPagina(delta) {
    paginaActual += delta;
    renderPagina();
    document.getElementById('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cambiarPorPagina() {
    porPagina    = parseInt(document.getElementById('por-pagina').value);
    paginaActual = 1;
    renderPagina();
}

/* =======================
   NUEVA ENTRADA
======================= */
function agregarEntrada() {
    if (poderActivo === 'TODOS') {
        alert('Selecciona primero un tipo de poder');
        return;
    }

    const nuevoId = 'nuevo_' + Date.now();
    const fila = {
        id: nuevoId,
        nombre: '',
        nombreOriginal: '',          // entradas nuevas no tienen nombre original en BD
        poderGobierno: poderActivo,
        confirmado: false,
        verificado: false,
    };

    filasOriginales[nuevoId] = fila;
    crearFila(fila, document.getElementById('formulario-dinamico'), true);
    hayCambiosPendientes = true;

    const coinciden = Array.from(document.querySelectorAll('.form-group'))
        .filter(div => div.dataset.poder === poderActivo && !filasOriginales[div.dataset.id]?.eliminado);
    const totalPags = porPagina >= 9999 ? 1 : Math.max(1, Math.ceil(coinciden.length / porPagina));
    paginaActual = totalPags;

    renderPagina();

    const nuevaFila = document.querySelector(`.form-group[data-id="${nuevoId}"]`);
    if (nuevaFila) {
        nuevaFila.querySelector('input').focus();
        nuevaFila.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

/* =======================
   GUARDAR
   - Envía registros activos para UPSERT/UPDATE.
   - Envía nombres de registros eliminados para DELETE real en el backend.
   - Envía `nombreOriginal` para que el backend pueda detectar renombres
     y hacer UPDATE en lugar de INSERT (evitando duplicados).
   - Aplica normalización NFC + limpieza de espacios para que la unique
     key (estado, nombre) coincida con lo que ya existe en BD.
======================= */
function guardarValidacion() {

    const payload    = [];
    const eliminados = [];

    document.querySelectorAll('.form-group').forEach(div => {
        const fila = filasOriginales[div.dataset.id];
        if (!fila) return;

        // Normalizar SIEMPRE antes de enviar
        const nombreActual = normalizarNombre(div.querySelector('input').value);

        if (fila.eliminado) {
            const esNuevo = String(fila.id).startsWith('nuevo_');
            if (!esNuevo) {
                // Borrar por ID (clave primaria = UUID), no por nombre.
                // El id es texto (UUID), NO un entero: se envía tal cual.
                const idStr = String(fila.id).trim();
                if (idStr) eliminados.push(idStr);
            }
            return; // No incluir en upsert
        }

        if (!nombreActual) return; // ignorar entradas vacías

        payload.push({
            id:             fila.id,
            nombre:         nombreActual,
            nombreOriginal: normalizarNombre(fila.nombreOriginal || ''),  // 👈 clave para detectar renombres
            poderGobierno:  fila.poderGobierno,
            confirmado:     div.dataset.confirmado === 'true' || div.dataset.verificado === 'true',
            verificado:     div.dataset.verificado === 'true',
        });
    });

    if (!payload.length && !eliminados.length) {
        alert('No hay registros para guardar');
        return;
    }

    Loader.show("Guardando verificación");
    fetch(window.BASE_URL + '/guardar-validacion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ filas: payload, eliminados: eliminados })
    })
    .then(r => r.json())
    .then(resp => {
        if (resp.error) {
            alert('Error: ' + resp.error);
            return;
        }
        hayCambiosPendientes = false;
        alert('Información guardada correctamente');
        // Recargar para reflejar el estado real de la BD
        // (los eliminados ya no aparecerán y los renombrados tendrán
        // su `nombreOriginal` actualizado al nombre nuevo)
        window.location.reload();
    })
    .catch(() => alert('Error al guardar'))
    .finally(() => Loader.hide());
}

/* =======================
   NAVEGACIÓN
======================= */
function irAValidarCodigos() {
    if (hayCambiosPendientes) {
        alert('Guarda la información antes de continuar');
        return;
    }

    Loader.show("Verificando entes obligados");
    fetch(window.BASE_URL + '/hay-entes-confirmados')
        .then(r => r.json())
        .then(resp => {
            if (!resp.hay) {
                alert('Primero marca como obligada al menos una institución');
                Loader.hide();
                return;
            }
            window.location.href = window.BASE_URL + '/validar-codigos';
        })
        .catch(() => Loader.hide());
}
</script>

<style>
/* ── Tarjeta verificada: fondo verde suave ── */
.form-group.verificado {
    border-left: 4px solid #2e7d32;
    background-color: #f0fdf4;
}

/* ── Botón verificar activo ── */
.btn-verificar {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
    cursor: pointer;
}
.btn-verificar.activo {
    background: #2e7d32;
    color: white;
    border-color: #2e7d32;
}
.btn-verificar:hover {
    opacity: 0.85;
}
</style>

</div>
{% endblock %}
